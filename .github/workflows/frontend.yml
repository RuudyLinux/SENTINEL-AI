# Frontend CI. There was previously none at all — a type error or a broken
# production build could reach main without anything noticing.
name: Frontend

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      # Unit tests. The e2e job below needs a full running stack and cannot
      # provoke a 503 or a dropped connection; these can, which is what makes
      # them worth having for lib/api.ts's retry rules.
      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  e2e:
    # The smoke test drives the REAL stack: a real backend against a throwaway
    # SQLite database, and the real dashboard build. It exercises the critical
    # flow end to end rather than mocking the API, which is the only way it can
    # catch a frontend/backend contract break.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libgl1 libglib2.0-0

      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Start backend
        working-directory: backend
        env:
          DB_PATH: ${{ runner.temp }}/e2e.db
          UPLOADS_DIR: ${{ runner.temp }}/uploads
          EVIDENCE_DIR: ${{ runner.temp }}/evidence
          # Demo mode seeds the admin account the smoke test logs in with.
          DEMO_MODE: "true"
          # The dashboard is served from http://localhost:3000 below, and a
          # browser treats localhost and 127.0.0.1 as different origins — every
          # API call would fail CORS and look like a broken login.
          CORS_ALLOWED_ORIGINS: "http://localhost:3000"
          SENTINEL_GRID_EMAIL: ""
          SENTINEL_GRID_PASSWORD: ""
          SENTINEL_GRID_AUTOCONNECT: "false"
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > backend.log 2>&1 &
          # Model weights load on first import, so readiness takes a while;
          # poll the real health endpoint rather than sleeping a fixed time.
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/api/health && break
            sleep 2
          done

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Install Playwright
        working-directory: frontend
        run: npx --yes playwright@1 install --with-deps chromium

      - name: Build and start frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE: http://127.0.0.1:8000
          NEXT_PUBLIC_WS_BASE: ws://127.0.0.1:8000
        run: |
          npm run build
          nohup npm run start > frontend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/login && break
            sleep 2
          done

      - name: Smoke test
        working-directory: frontend
        run: npx --yes playwright@1 test

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: |
            frontend/playwright-report/
            frontend/test-results/
            backend/backend.log
            frontend/frontend.log
          retention-days: 7
