[pytest]
testpaths = tests

# A warning that names one of OUR modules is a defect report, not noise. Two
# of them hid here for a long time and both were real: `ws.py` dropped a
# coroutine it had already built, and `clips.py` left an ffmpeg pipe open that
# it also never drained (the unread half could deadlock an encode). They were
# invisible because they were listed alongside a handful of third-party
# deprecations nobody can act on.
#
# So: anything raised from `app.*` FAILS the run, and the specific
# third-party warnings are ignored by exact message. Ignoring by message
# rather than by module is deliberate — when one of these libraries is
# upgraded the filter stops matching, and the new warning is seen rather than
# silently swallowed for another year.
filterwarnings =
    error::RuntimeWarning:app.*
    error::ResourceWarning:app.*
    # starlette.testclient imports httpx at module scope; nothing in this
    # project chooses that, and the suggested httpx2 is not a drop-in.
    ignore:Using `httpx` with `starlette.testclient` is deprecated.*
    # starlette's own type alias, emitted while importing TestClient.
    ignore:The anyio.abc.BlockingPortal alias is deprecated.*
    # easyocr/torch quantization, raised inside the vendored OCR model load.
    ignore:torch.ao.quantization is deprecated.*
    ignore:torch.quantize_per_tensor, torch.quantize_per_channel.*
