# Alembic configuration.
#
# The database URL is deliberately NOT set here: it is resolved at runtime from
# the application's own settings (see alembic/env.py), so migrations always run
# against the same datastore the app would use and a URL can never drift
# between the two. Set DATABASE_URL in the environment / backend/.env instead.

[alembic]
script_location = alembic
prepend_sys_path = .
# Timestamped, ordered filenames so the migration history reads chronologically
# on disk, not just in the revision graph.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
